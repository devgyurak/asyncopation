# Install with `make hooks-install`. Every hook runs through uv so versions match uv.lock.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: guards
        name: project guards (architecture, tests, language)
        entry: uv run python -m tools.guards
        language: system
        pass_filenames: true
      - id: import-linter
        name: import-linter
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        files: ^src/
      - id: agentsync
        name: agent config in sync with .agents/
        entry: uv run python -m tools.agentsync --check
        language: system
        pass_filenames: false
        files: ^(\.agents/|\.claude/|\.codex/|\.pi/|AGENTS\.md)
