# --- ADR-0008: compile-only wrapper and compile_scope ---------------------------------------

[[internal]]
module = "django.db.backends.postgresql.base"
names = ["DatabaseWrapper"]
used_by = ["src/asyncopation/_django/postgresql.py"]
reason = """Base class of the compile-only PostgreSQL wrapper, re-exported to compile/postgresql.py (no I/O \
in construction; server info injected into the instance `__dict__`). The wrapper redefines `chunked_cursor`, \
`get_new_connection` and `create_cursor`, which `CompileOnlyMixin` overrides again; the \
signatures are pinned as an alarm."""
verified_against = "6.1.3"
signatures = { "DatabaseWrapper.chunked_cursor" = "(self)", "DatabaseWrapper.get_new_connection" = "(self, conn_params)", "DatabaseWrapper.create_cursor" = "(self, name=None)" }

[[internal]]
module = "django.db.backends.postgresql.operations"
names = ["DatabaseOperations"]
used_by = ["src/asyncopation/_django/postgresql.py"]
reason = """`CompileOperations` overrides `compose_sql`: Django's version calls `mogrify` -> \
`connection.cursor()`, which `contrib.postgres` `SearchHeadline` options reach while the SQL is \
generated (contrib/postgres/search.py, its only caller there). The override is plain Python, \
with no driver and no server settings involved: it renders the exact types str / int / float / \
bool / None and finite Decimal byte for byte like Django's output on a live connection (checked \
against psycopg's compiled binary build and its pure-Python implementation, not a source-built \
c one; finite negative numbers, signed zeros included, get the leading space) and rejects every \
other type at build time: non-finite Decimal (the two implementations render the NaN variants \
differently: the binary one -NaN as " -NaN" and NaN123 as "NaN123", the pure-Python one every \
such value as 'NaN'::numeric; +-Infinity, plain NaN and positive sNaN are alike in both and are \
rejected with them) and every subclass, since the two psycopg implementations disagree about \
subclasses and an overridden __str__ would put arbitrary text into the SQL; a NUL character is a \
ValueError (live: DataError); tests/integration compares both (`make test-compose-python` for \
the pure-Python one)."""
verified_against = "6.1.3"
signatures = { "DatabaseOperations.compose_sql" = "(self, sql, params)" }

[[internal]]
module = "django.db.backends.base.base"
names = ["BaseDatabaseWrapper"]
used_by = ["src/asyncopation/_django/postgresql.py", "src/asyncopation/_django/mysql.py"]
reason = """`CompileOnlyMixin` (compile/wrapper.py) (also the backend-neutral base of the MySQL / MariaDB compile-only wrapper, `_django/mysql.py`) overrides these methods to make the wrapper incapable of I/O \
(SQLCompiler.as_sql reaches `get_autocommit` -> `ensure_connection` -> `connect` for \
select_for_update); the signatures are pinned so a changed upstream signature fails the drift \
test instead of silently diverging. (`ensure_connection` is not pinned: pytest-django's DB \
blocker replaces it with `(*args, **kwargs)` during tests.)"""
verified_against = "6.1.3"
signatures = { "BaseDatabaseWrapper.get_autocommit" = "(self)", "BaseDatabaseWrapper.connect" = "(self)", "BaseDatabaseWrapper._cursor" = "(self, name=None)", "BaseDatabaseWrapper.cursor" = "(self)", "BaseDatabaseWrapper.chunked_cursor" = "(self)", "BaseDatabaseWrapper.get_new_connection" = "(self, conn_params)", "BaseDatabaseWrapper.create_cursor" = "(self, name=None)" }

