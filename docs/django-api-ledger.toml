# Django API ledger
#
# Every Django import under src/ must be covered here (enforced by tools/guards, code A201), and
# every import outside [public] may only live in src/asyncopation/_django/ (code A203).
#   [public]      modules we treat as stable public API - no entry needed per symbol.
#   [[internal]]  anything else: private helpers, internal modules, ported code we depend on.
#                 These are what break when Django changes; the CI "django-main canary" job and
#                 the `verified_against` field tell us when to re-check them. Optional
#                 `signatures = { "Query.get_compiler" = "<str(inspect.signature(obj))>" }` pins
#                 callables; keys are dotted paths below the module and MUST be quoted when dotted;
#                 the first segment must be listed in `names`. `names` is required (`"*"` = the whole
#                 module). `ported = true` marks code that is ported but never imported (e.g. the
#                 MySQL backend, which imports MySQLdb): names may then be dotted, `signatures` are
#                 not allowed, A202 skips the entry, the drift test reads the module source instead
#                 and importing it is still an A201. `"*"` is not allowed: name what was ported.
#   [[attribute]] every private attribute we access directly, inside _django or not (`owner` is
#                 the dotted class path, e.g. qs._fetch_mode; `signatures` is allowed for methods).
#                 The guard cannot find such accesses; arch review does. Register them so the
#                 drift test protects them.
# `used_by`, `reason` and `verified_against` are required on every entry. Unknown keys, duplicate
# entries, missing fields and wrong types make the guard fail with a message.
# A202 flags an [[internal]] item (not `ported`) not imported under _django (any absolute import,
# asgiref included), and an [[attribute]] name never accessed in src. tests/unit/django_drift checks every entry against Django.
#
# Entry template:
#   [[internal]]
#   module = "django.db.models.query"
#   names = ["ModelIterable", "RelatedPopulator"]
#   used_by = ["src/asyncopation/query/iterables.py"]
#   reason = "Instance construction logic ported from ModelIterable.__iter__"
#   verified_against = "6.1.3"
#   # optional: signatures = { "Name.method" = "(self, ...)" }  or  ported = true (not both)
#
#   [[attribute]]
#   owner = "django.db.models.query.QuerySet"
#   names = ["_fetch_mode"]
#   used_by = ["src/asyncopation/query/queryset.py"]
#   reason = "Read to decide fetch-mode behaviour"
#   verified_against = "6.1.3"

[public]
modules = [
    "django",
    "django.apps",
    "django.conf",
    "django.core.exceptions",
    "django.db",
    "django.db.models",
    "django.db.models.functions",
    "django.db.models.signals",
    "django.dispatch",
    "django.utils.functional",
]

