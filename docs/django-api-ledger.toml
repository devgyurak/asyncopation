# --------------------------------------------------------------------------- Runtime dependencies (#49)
[[dependency]]
package = "asgiref"
names = ["local.Local"]
used_by = ["src/asyncopation/_django/connections.py"]
reason = """`compile_scope` swaps a wrapper into Django's `ConnectionHandler._connections`, an \
`asgiref.local.Local(thread_critical=True)`. In sync code it is a plain thread-local; inside a \
running loop it is backed by a contextvar, so the swap is visible to awaited code and to tasks \
created afterwards but not to the parent, siblings or any other thread (`asyncio.to_thread`, \
`sync_to_async` either way, plain threads). src never imports asgiref; the dependency is runtime \
behaviour, pinned by tests/unit/django_drift/test_asgiref_local_drift.py and \
test_connection_handler_drift.py. The installed version must EQUAL `verified_against`. \
Threads: a thread-critical `Local` keeps one contextvar per thread, so a context a thread \
inherited (`copy_context().run`, or Python 3.14's `thread_inherit_context`) is not read; \
the pins cover a copied context on 3.13 too (asgiref's thread-id tag on `_Storage` is moot \
for a thread-critical `Local`; real 3.14 inheritance itself is not exercised on 3.13)"""
verified_against = "3.13.0"
